<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="120" y1="40" x2="190" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="140" cy="160" rx="90" ry="8" fill="#e2e8f0" opacity="0.6"/>

  <!-- Background documents -->
  <rect x="75" y="55" width="70" height="90" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-8 75 55)"/>
  <rect x="110" y="45" width="75" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(5 110 45)"/>

  <!-- Lines on document -->
  <line x1="125" y1="65" x2="165" y2="69" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="123" y1="78" x2="168" y2="82" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="121" y1="91" x2="155" y2="94" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Big Magnifying Glass -->
  <g filter="url(#glassShadow)">
    <circle cx="150" cy="80" r="38" fill="url(#lensGrad)" stroke="#2563eb" stroke-width="5"/>
    <circle cx="150" cy="80" r="30" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <!-- Question mark inside lens -->
    <path d="M145 68C145 64.5 147.5 62 151 62C154.5 62 157 64.5 157 68C157 71.5 154 73 151 75V79" stroke="#2563eb" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="151" cy="86" r="2" fill="#2563eb"/>
    <!-- Handle -->
    <rect x="178" y="106" width="12" height="42" rx="6" fill="#1e40af" transform="rotate(-45 178 106)"/>
    <rect x="180" y="108" width="6" height="38" rx="3" fill="#3b82f6" transform="rotate(-45 178 106)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="90" cy="35" r="3" fill="#f59e0b"/>
  <circle cx="215" cy="40" r="2.5" fill="#3b82f6"/>
</svg>

