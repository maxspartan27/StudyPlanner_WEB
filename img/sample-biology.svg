<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none">
  <rect width="320" height="200" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>

  <!-- Badge Header -->
  <rect x="15" y="12" width="175" height="24" rx="4" fill="#0891b2"/>
  <text x="25" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Біологія: Спіраль ДНК</text>

  <!-- DNA Double Helix -->
  <path d="M45 65 C85 65, 95 145, 135 145 C175 145, 185 65, 225 65 C255 65, 270 120, 290 135" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M45 145 C85 145, 95 65, 135 65 C175 65, 185 145, 225 145 C255 145, 270 90, 290 75" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Base Pairs (Rungs) -->
  <line x1="62" y1="74" x2="62" y2="136" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="3 2"/>
  <line x1="80" y1="90" x2="80" y2="120" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="115" y1="80" x2="115" y2="130" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="135" y1="68" x2="135" y2="142" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="155" y1="80" x2="155" y2="130" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="198" y1="85" x2="198" y2="125" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="225" y1="68" x2="225" y2="142" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="248" y1="82" x2="248" y2="128" stroke="#10b981" stroke-width="2.5"/>

  <!-- Nucleotide Nodes -->
  <circle cx="62" cy="74" r="4" fill="#0284c7"/>
  <circle cx="62" cy="136" r="4" fill="#10b981"/>
  <circle cx="135" cy="68" r="4.5" fill="#10b981"/>
  <circle cx="135" cy="142" r="4.5" fill="#0284c7"/>
  <circle cx="225" cy="68" r="4.5" fill="#0284c7"/>
  <circle cx="225" cy="142" r="4.5" fill="#10b981"/>

  <!-- Labels -->
  <rect x="20" y="162" width="280" height="26" rx="5" fill="#cffafe"/>
  <text x="160" y="179" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0e7490" text-anchor="middle">Аденін (A) = Тимін (T) • Гуанін (G) ≡ Цитозин (C)</text>
</svg>

