<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none">
  <rect width="320" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M0 40H320M0 80H320M0 120H320M0 160H320" stroke="#f1f5f9" stroke-width="1.5"/>
  <path d="M40 0V200M80 0V200M120 0V200M160 0V200M200 0V200M240 0V200M280 0V200" stroke="#f1f5f9" stroke-width="1.5"/>
  
  <!-- Right triangle -->
  <polygon points="60,150 240,150 240,50" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right angle mark -->
  <rect x="220" y="130" width="20" height="20" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="145" y="170" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e40af">a = 4 cm</text>
  <text x="250" y="105" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e40af">b = 3 cm</text>
  <text x="120" y="90" font-family="sans-serif" font-weight="bold" font-size="16" fill="#2563eb">c = √(a² + b²) = 5 cm</text>

  <!-- Title badge -->
  <rect x="15" y="12" width="130" height="24" rx="4" fill="#2563eb"/>
  <text x="25" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Теорема Піфагора</text>
</svg>

