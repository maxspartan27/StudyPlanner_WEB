<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none">
  <rect width="320" height="200" rx="10" fill="#fdfbf7" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Physics diagram: Circuit with Ohm's law -->
  <rect x="15" y="12" width="160" height="24" rx="4" fill="#0284c7"/>
  <text x="25" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Закон Ома: I = U / R</text>

  <!-- Circuit lines -->
  <path d="M60 90H100" stroke="#0f172a" stroke-width="3"/>
  <!-- Resistor zigzag -->
  <path d="M100 90L108 75L124 105L140 75L156 105L172 75L180 90" stroke="#0284c7" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <path d="M180 90H260V150H60V90" stroke="#0f172a" stroke-width="3" fill="none"/>
  
  <!-- DC Source in bottom line -->
  <line x1="150" y1="135" x2="150" y2="165" stroke="#dc2626" stroke-width="4"/>
  <line x1="162" y1="142" x2="162" y2="158" stroke="#0f172a" stroke-width="4"/>
  <text x="135" y="145" font-family="sans-serif" font-weight="bold" font-size="14" fill="#dc2626">+</text>
  <text x="172" y="145" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0f172a">−</text>

  <!-- Labels -->
  <text x="130" y="65" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0284c7">R = 10 Ом</text>
  <text x="135" y="185" font-family="sans-serif" font-weight="bold" font-size="14" fill="#dc2626">U = 220 В</text>
  <text x="200" y="115" font-family="sans-serif" font-weight="bold" font-size="14" fill="#16a34a">I = 22 А →</text>
</svg>

